[project]
name = "creative-os"
version = "0.1.0"
description = "Библиотека рекламных креативов Meta, склеенная со сквозной воронкой до сделки"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
